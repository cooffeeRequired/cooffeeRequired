name: Update README (WakaTime + GitHub)

on:
  schedule:
    - cron: "15 */6 * * *"   # každých 6 hodin v :15
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # dostupné pro všechny kroky – skript si je načte z process.env
      WAKA_TIME_DAILY_URL: ${{ secrets.WAKA_TIME_DAILY_URL }}
      WAKA_TIME_ALLTIME_URL: ${{ secrets.WAKA_TIME_ALLTIME_URL }}
      WAKA_TIME_LANGS_URL: ${{ secrets.WAKA_TIME_LANGS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Echo Waka env (masked)
        run: |
          echo "DAILY set? ${{ secrets.WAKA_TIME_DAILY_URL != '' }}"
          echo "ALLTIME set? ${{ secrets.WAKA_TIME_ALLTIME_URL != '' }}"
          echo "LANGS set? ${{ secrets.WAKA_TIME_LANGS_URL != '' }}"

      # (volitelné) pokud používáte dotenv v update-readme.js
      # - run: npm ci

      - name: Run updater
        run: node src/update-readme.js --verbose

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & push if changed
        run: |
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: auto-update README (WakaTime + GitHub)"
            git push
            echo "Pushed README changes."
          else
            echo "No README changes."
          fi
